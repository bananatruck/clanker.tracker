name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/demo/**'
      - 'docs/sprites/**'
      - 'docs/backdrops/**'
      - 'scripts/site.mjs'
      - 'scripts/render-backdrops.mjs'
      - 'scripts/render-sprites.mjs'
      - 'src/lib/game/backdrop.ts'
      - 'src/lib/game/sprites.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pushing a branch, not calling deploy-pages. The official action needs a
# second job, a `github-pages` environment, and a runner of its own to do
# nothing but move an artifact — and that second runner is exactly where this
# sat queued for twenty minutes while the build beside it finished in
# twenty-five seconds. Publishing the built directory to `gh-pages` and letting
# GitHub serve the branch removes the whole hop.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The acts and the sprites are regenerated from source rather than taken
      # from the committed copies, so the site cannot ship art that has drifted
      # from the code that draws it. Both are pure Node and take milliseconds.
      #
      # The *screenshots* are not regenerated: those need a headless browser
      # driving the built extension, and a deploy that can fail because Chrome
      # moved in a runner image is a deploy that will. They are committed, and
      # `pnpm shots` regenerates them locally.
      - run: pnpm backdrops
      - run: pnpm sprites
      - run: pnpm site

      - name: Publish to gh-pages
        run: |
          set -eu
          # `.nojekyll` because Jekyll silently drops paths beginning with an
          # underscore, and finding that out in production is miserable.
          touch .output/site/.nojekyll

          cd .output/site
          git init -q -b gh-pages
          git config user.name  "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          # Force, because this branch is build output with no history worth
          # keeping — it is a directory that happens to be stored in git.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
